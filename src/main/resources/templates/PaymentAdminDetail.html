<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin Detail</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h3>Payment Detail (Admin)</h3>
    <div th:if="${payment != null}">
        <p>Payment ID: <strong th:text="${payment.id}"></strong></p>
        <p>Method: <strong th:text="${payment.method}"></strong></p>
        <p>Status: <strong th:text="${payment.status}"></strong></p>
        <form th:action="@{/payment/admin/set-status/{id}(id=${payment.id})}" method="post">
            <button type="submit" name="status" value="SUCCESS" class="btn btn-success">Accept</button>
            <button type="submit" name="status" value="REJECTED" class="btn btn-danger">Reject</button>
        </form>
    </div>
    <a th:href="@{/payment/admin/list}" class="btn btn-secondary mt-3">Back to List</a>
</div>
</body>
</html>
