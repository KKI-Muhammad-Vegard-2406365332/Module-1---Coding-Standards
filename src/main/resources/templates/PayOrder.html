<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h3>Pay Order: <span th:text="${order.id}"></span></h3>
    <form th:action="@{/order/pay/{id}(id=${order.id})}" method="post">
        <div class="form-group">
            <label for="methodInput">Payment Method</label>
            <select name="method" class="form-control mb-4 col-4" id="methodInput">
                <option value="VOUCHER_CODE">Voucher Code</option>
                <option value="BANK_TRANSFER">Bank Transfer</option>
            </select>
        </div>
        <div class="form-group">
            <label for="voucherCodeInput">Voucher Code (if applicable)</label>
            <input type="text" name="voucherCode" class="form-control mb-4 col-4" id="voucherCodeInput">
        </div>
        <div class="form-group">
            <label for="bankNameInput">Bank Name (if applicable)</label>
            <input type="text" name="bankName" class="form-control mb-4 col-4" id="bankNameInput">
        </div>
        <div class="form-group">
            <label for="referenceCodeInput">Reference Code (if applicable)</label>
            <input type="text" name="referenceCode" class="form-control mb-4 col-4" id="referenceCodeInput">
        </div>
        <button type="submit" class="btn btn-primary">Pay</button>
    </form>
</div>
</body>
</html>
