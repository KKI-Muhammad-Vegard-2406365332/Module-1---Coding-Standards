<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Created</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h3>Payment Created</h3>
    <p>Your Payment ID: <strong th:text="${payment.id}"></strong></p>
    <p>Status: <strong th:text="${payment.status}"></strong></p>
    <a th:href="@{/payment/detail/{id}(id=${payment.id})}" class="btn btn-info">View Payment Detail</a>
    <a th:href="@{/}" class="btn btn-secondary">Home</a>
</div>
</body>
</html>
